<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -3 101.1 146" width="350" height="506">
  <title>A rev2 Game Bub showing its main menu</title>
  <desc>Simplified front-view illustration of the Game Bub rev2 handheld shell, proportioned from the measured shell geometry (95.1 x 140 mm face, R5 corners).</desc>
  <defs>
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f5f1"/>
      <stop offset="100%" stop-color="#e3e0d8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- shell body: 95.1 x 140 mm, R5 corners -->
  <rect x="0" y="0" width="95.1" height="140" rx="5" ry="5" fill="url(#shellGrad)" stroke="#c7c4ba" stroke-width="0.6" filter="url(#softShadow)"/>

  <!-- screen glass pocket: 92.1 x 67.9 -->
  <rect x="1.5" y="1.5" width="92.1" height="67.9" rx="3" ry="3" fill="#1b1c1f"/>
  <!-- LCD active area: 84.0 x 55.8, centered in the pocket -->
  <rect x="5.53" y="7.55" width="84.04" height="55.76" rx="1.2" fill="#06080c"/>
  <clipPath id="lcdClip"><rect x="5.53" y="7.55" width="84.04" height="55.76" rx="1.2"/></clipPath>
  <image x="5.530" y="7.550" width="84.040" height="55.760" preserveAspectRatio="none" clip-path="url(#lcdClip)" href="data:image/png;base64,"/>
  <polygon points="6.98,9 26.98,9 12.98,40 6.98,40" fill="#ffffff" opacity="0.05"/>
  <!-- status LED: small opening at the bottom-right corner of the screen bezel -->
  <circle cx="90.3" cy="66.3" r="1.5" fill="#0c0d10"/>
  <circle cx="90.3" cy="66.3" r="0.8" fill="#d9ddd0"/>

  <!-- D-pad: opening centred at (-27.55, 46) from device centre -->
  <circle cx="20" cy="94" r="14.5" fill="#dcdad2" stroke="#c7c4ba" stroke-width="0.4"/>
  <rect x="8" y="90" width="24" height="8" rx="1.6" fill="#37373a"/>
  <rect x="16" y="82" width="8" height="24" rx="1.6" fill="#37373a"/>

  <!-- ABXY: opening centred at (27.55, 46) -->
  <circle cx="75.1" cy="94" r="14.5" fill="#dcdad2" stroke="#c7c4ba" stroke-width="0.4"/>
  <circle cx="75.1" cy="85" r="4.3" fill="#37373a" stroke="#232325" stroke-width="0.3"/>
  <circle cx="84.1" cy="94" r="4.3" fill="#37373a" stroke="#232325" stroke-width="0.3"/>
  <circle cx="75.1" cy="103" r="4.3" fill="#37373a" stroke="#232325" stroke-width="0.3"/>
  <circle cx="66.1" cy="94" r="4.3" fill="#37373a" stroke="#232325" stroke-width="0.3"/>

  <!-- Home: Ø9.2 at (0, 32.3), debossed ring around the button; button matches select/start size -->
  <circle cx="47.55" cy="107.7" r="4.08" fill="#c7c4ba"/>
  <circle cx="47.55" cy="107.7" r="3.18" fill="url(#shellGrad)"/>
  <circle cx="47.55" cy="107.7" r="2.38" fill="#37373a" stroke="#232325" stroke-width="0.3"/>

  <!-- Start / Select: debossed slot at (0, 16.65) holding two round buttons (70% of original size), ring brought in snug around them -->
  <rect x="39.47" y="119.27" width="16.16" height="8.16" rx="4.08" fill="#c7c4ba"/>
  <rect x="40.37" y="120.17" width="14.36" height="6.36" rx="3.18" fill="url(#shellGrad)"/>
  <circle cx="43.55" cy="123.35" r="2.38" fill="#37373a" stroke="#232325" stroke-width="0.3"/>
  <circle cx="51.55" cy="123.35" r="2.38" fill="#37373a" stroke="#232325" stroke-width="0.3"/>

  <!-- speaker grilles, lower left and right corners -->
  <g fill="#8f8c82">
    <g id="grilleL">
      <circle cx="12.9" cy="132.5" r="0.5"/><circle cx="14.1" cy="132.5" r="0.5"/><circle cx="15.3" cy="132.5" r="0.5"/><circle cx="16.5" cy="132.5" r="0.5"/><circle cx="17.7" cy="132.5" r="0.5"/><circle cx="18.9" cy="132.5" r="0.5"/><circle cx="20.1" cy="132.5" r="0.5"/>
      <circle cx="12.9" cy="133.7" r="0.5"/><circle cx="14.1" cy="133.7" r="0.5"/><circle cx="15.3" cy="133.7" r="0.5"/><circle cx="16.5" cy="133.7" r="0.5"/><circle cx="17.7" cy="133.7" r="0.5"/><circle cx="18.9" cy="133.7" r="0.5"/><circle cx="20.1" cy="133.7" r="0.5"/>
      <circle cx="12.9" cy="134.9" r="0.5"/><circle cx="14.1" cy="134.9" r="0.5"/><circle cx="15.3" cy="134.9" r="0.5"/><circle cx="16.5" cy="134.9" r="0.5"/><circle cx="17.7" cy="134.9" r="0.5"/><circle cx="18.9" cy="134.9" r="0.5"/><circle cx="20.1" cy="134.9" r="0.5"/>
      <circle cx="12.9" cy="136.1" r="0.5"/><circle cx="14.1" cy="136.1" r="0.5"/><circle cx="15.3" cy="136.1" r="0.5"/><circle cx="16.5" cy="136.1" r="0.5"/><circle cx="17.7" cy="136.1" r="0.5"/><circle cx="18.9" cy="136.1" r="0.5"/><circle cx="20.1" cy="136.1" r="0.5"/>
    </g>
    <use href="#grilleL" x="62.1" y="0"/>
  </g>

  <!-- power button: right edge, near the top of the screen bezel -->
  <rect x="95.1" y="15.4" width="2.2" height="6.3" rx="1" fill="#37373a"/>
  <!-- volume toggle: left edge, two segments -->
  <rect x="-2.2" y="28" width="2.2" height="6" rx="1" fill="#37373a"/>
  <rect x="-2.2" y="38" width="2.2" height="6" rx="1" fill="#37373a"/>
</svg>
